---
name: Auto Release on PR Merge

on:
  pull_request:
    types: [closed]

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    # Lets the job push the release commit and tag with the default
    # GITHUB_TOKEN. The previous approach relied on a GH_PAT secret that was
    # never populated, so the remote URL resolved to
    # https://x-access-token:@github.com/... and the push fell back to
    # github-actions[bot], which has read-only contents by default:
    #   remote: Permission to vakintosh/istrip_plus_HA.git denied
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js (for changelog tool)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tools
        run: |
          npm install -g conventional-changelog-cli

      - name: Get current version
        id: get_version
        run: |
          VERSION=$(jq -r .version custom_components/istrip/manifest.json)
          echo "current=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Detect bump type from PR title
        id: bump
        # Passed through the environment, never expanded into the script: a
        # PR title is attacker-controlled and this job holds a write token.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # A "!" before the colon marks a breaking change, for fix as well
          # as feat.
          if echo "$TITLE" | grep -qi "BREAKING CHANGE" ||
            echo "$TITLE" | grep -qE '^(feat|fix)(\([^)]*\))?!:'; then
            BUMP="major"
          elif echo "$TITLE" | grep -qE '^feat(\([^)]*\))?:'; then
            BUMP="minor"
          elif echo "$TITLE" | grep -qE '^fix(\([^)]*\))?:'; then
            BUMP="patch"
          else
            # docs/ci/chore/test/refactor/style and anything else ships no
            # user-visible change, so cut no release at all.
            BUMP="none"
          fi
          echo "type=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: bump_version
        if: steps.bump.outputs.type != 'none'
        run: |
          OLD="${{ steps.get_version.outputs.current }}"

          # Parse the version using POSIX-compatible tools
          major=$(echo "$OLD" | cut -d. -f1)
          minor=$(echo "$OLD" | cut -d. -f2)
          patch=$(echo "$OLD" | cut -d. -f3)

          case "${{ steps.bump.outputs.type }}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          NEW="$major.$minor.$patch"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

          # Keep manifest.json and pyproject.toml in lockstep. They have
          # drifted before when this was done by hand.
          MANIFEST=custom_components/istrip/manifest.json
          jq --arg v "$NEW" '.version = $v' "$MANIFEST" > tmp
          mv tmp "$MANIFEST"
          sed -i -E "s/^version = \".*\"/version = \"$NEW\"/" pyproject.toml

          # Fail loudly rather than tagging a release with a stale version.
          grep -q "\"version\": \"$NEW\"" "$MANIFEST"
          grep -q "^version = \"$NEW\"" pyproject.toml

      - name: Generate CHANGELOG
        if: steps.bump.outputs.type != 'none'
        run: |
          # The tag does not exist yet and the repo has no package.json, so
          # hand the tool the new version explicitly; otherwise every heading
          # comes out with an empty version and a compare link ending in "v".
          # name is required by the tool's package normalisation; repository
          # keeps the compare links pointing at this repo.
          REPO_URL="https://github.com/vakintosh/istrip_plus_HA"
          printf '{"name": "istrip", "version": "%s", "repository": {"type": "git", "url": "%s"}}\n' \
            "${{ steps.bump_version.outputs.new }}" "$REPO_URL" \
            > "$RUNNER_TEMP/package.json"
          touch CHANGELOG.md
          conventional-changelog -p angular -i CHANGELOG.md -s \
            --pkg "$RUNNER_TEMP/package.json" -t v
          # Release body should describe this release only, not the whole file.
          conventional-changelog -p angular -r 1 \
            --pkg "$RUNNER_TEMP/package.json" -t v > RELEASE_NOTES.md

      - name: Commit and tag
        if: steps.bump.outputs.type != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/istrip/manifest.json \
            pyproject.toml CHANGELOG.md
          git commit -m "chore(release): v${{ steps.bump_version.outputs.new }}"
          git tag "v${{ steps.bump_version.outputs.new }}"
          git push origin HEAD:main --follow-tags

      - name: Create GitHub Release
        if: steps.bump.outputs.type != 'none'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.bump_version.outputs.new }}
          name: v${{ steps.bump_version.outputs.new }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
