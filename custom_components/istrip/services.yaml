set_speed:
  name: Set Speed
  description: >-
    Set the animation speed of the active effect on an iStrip+ light (0-100;
    0 is sent as 1). With no effect active, the speed is held and applied to
    the next effect selected.
  target:
    entity:
      integration: istrip
      domain: light
  fields:
    speed:
      name: Speed
      description: Speed value (0..100)
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 1

set_effect:
  name: Set Effect
  description: Set an effect on an iStrip+ light.
  target:
    entity:
      integration: istrip
      domain: light
  fields:
    effect:
      name: Effect
      description: >-
        Effect name, one of the light's effects (for example 7-Color Fade or
        Red Strobe).
      required: true
      selector:
        select:
          options:
            - 7-Color Fade
            - 3-Color Fade
            - Red Breathing
            - Red Strobe
            - 7-Color Breathing
            - 3-Color Breathing
            - Blue Breathing
            - Blue Strobe
            - 7-Color Flash
            - 3-Color Flash
            - Green Breathing
            - Green Strobe

    speed:
      name: Speed
      description: Optional speed (0..100) to apply with the effect
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
